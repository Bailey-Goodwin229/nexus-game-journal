spring.application.name=nexus-gaming-api
spring.jpa.hibernate.ddl-auto=update

# Database Routing- Accepts .env variables or local container mappings
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nexus_gaming}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_ROOT_PASSWORD:Sharingan1!}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Twitch API Configuration - Maps to your active environmental variables
twitch.client.id=${TWITCH_CLIENT_ID}
twitch.client.secret=${TWITCH_CLIENT_SECRET}
twitch.url=${TWITCH_URL}
twitch.api.url=${TWITCH_API_URL}

# Authentication Architecture Hook
jwt.secret=${JWT_SECRET_KEY}

# Information for login to application for security
spring.security.user.name=${APP_USERNAME}
spring.security.user.password=${APP_PASSWORD}
